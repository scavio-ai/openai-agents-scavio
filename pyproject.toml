[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-scavio"
version = "0.6.2"
description = "198 Scavio real-time search, extract and website crawl tools over 33 platforms (Google, YouTube, Amazon, Walmart, eBay, Target, HEB, Kroger, Zillow, Booking.com, Indeed, SEC EDGAR, G2, Meta Ad Library and more) for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scavio", email = "support@scavio.dev" }]
keywords = ["openai", "openai-agents", "agents", "scavio", "search", "tools", "serp", "web-scraping", "url-extract", "web-crawler", "sitemap", "tavily-alternative"]
dependencies = [
    "openai-agents>=0.17",
    "scavio>=0.27.0",
]

[project.urls]
Homepage = "https://scavio.dev"
Repository = "https://github.com/scavio-ai/openai-agents-scavio"
Documentation = "https://scavio.dev/docs/openai-agents"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["openai_agents_scavio"]
